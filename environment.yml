name: crisprog
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - anndata
  - h5py
  - matplotlib
  - scanpy
  - scikit-learn
  - numba
  - pyyaml
  - requests
  - pytest
  - pip
  - r-base>=4.3
  - r-matrix
  - bioconductor-aucell
  - bioconductor-rhdf5
  - bioconductor-biocparallel
  - r-domc                   # AUCell's parallel AUC computation
  - r-dorng
  - pip:
      - hotspotsc
      - cnmf
      - anthropic
