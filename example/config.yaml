# CRISProg example run on the simulated screen (python example/make_example.py writes it to data/example/).
# Paths are relative to this file.
name: example                 # results go to <repo>/results/example/

data:
  h5ad: ../data/example/example.h5ad
  counts_layer: counts
  guide_col: guides
  control_pattern: "^NTC_"                 # 40 non-targeting guides
  target_map: ../data/example/guide_targets.tsv

programs:
  file: null                  # set to ../data/example/programs.gmt to use the true programs instead of discovering them
  discover:
    methods: [hotspot, hdwgcna]
    hotspot:
      n_genes: 500
    hdwgcna:
      soft_power: 12          # the simulation is ~90% pure-noise genes, which fools the automatic choice

covariates:
  use: [log_n_genes, moi]
  batch: [batch]

association:
  n_perm: 1000

annotation:
  context: >
    Simulated high-MOI CRISPRi screen (6,000 cells, 2,000 genes, ~6 guides per cell). Two perturbations
    have planted trans effects on gene programs; everything else is null. Genes are named G0001-G2000,
    so there is no real biology to find.
